name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # main push 시에는 Backend CD가 이 워크플로를 호출해 테스트한다
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: toggleme
          MYSQL_USER: toggleme
          MYSQL_PASSWORD: toggleme
          MYSQL_ROOT_PASSWORD: root
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_PORT: 3306
      DB_NAME: toggleme
      DB_USERNAME: toggleme
      DB_PASSWORD: toggleme

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate test JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
