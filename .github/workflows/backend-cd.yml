name: Backend CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-cd
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/itta-10th-team1/toggle-me-backend

jobs:
  test:
    name: Test
    uses: ./.github/workflows/backend-ci.yml

  deploy:
    name: Build image and deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.toggleme.site
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: ./gradlew bootJar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: build/libs
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # SSH 키를 받는 서드파티 액션이라 커밋 SHA로 고정한다 (scp-action v1.0.0, ssh-action v1.2.5)
      - name: Copy compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: docker-compose.prod.yml
          target: /home/${{ secrets.EC2_USER }}/toggleme

      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          APP_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: APP_TAG
          script: |
            set -eu
            test "$(df --output=pcent / | tail -1 | tr -dc 0-9)" -lt 85
            cd ~/toggleme
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -af --filter "until=168h"

      - name: Health check
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 30 --retry-delay 5 --retry-all-errors --max-time 5
          https://api.toggleme.site/actuator/health

      # 실패 원인(예: 앱 기동 실패)을 Actions 로그에서 바로 보려고 서버 상태와 앱 로그를 출력한다
      # 공개 레포라 로그가 공개된다. 앱이 비밀값을 로그에 남기지 않도록 유지한다
      - name: Show server status on failure
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            cd ~/toggleme
            docker compose -f docker-compose.prod.yml ps -a
            docker compose -f docker-compose.prod.yml logs --tail 100 app
