spring:
  application:
    name: toggle-me
  config:
    import: optional:file:.env[.properties]
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.1-flash-lite
    # 재시도는 Gemini SDK 한 곳에서만 한다(GeminiConfig). 이 값은 재시도 횟수라 2면 SDK 재시도와 곱해져 호출이 늘어난다
    retry:
      max-attempts: 0
  mail:
    # 인증 메일 발송(Gmail SMTP). username이 비어 있으면 메일을 보내지 않고 코드를 로그로만 남긴다(로컬 개발용)
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:toggleme}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  # Nginx(HTTPS) 뒤에서 X-Forwarded-Proto·For를 반영한다. Tomcat이 내부 프록시 대역에서 온 헤더만 신뢰한다
  forward-headers-strategy: native
  tomcat:
    redirect-context-root: false

cors:
  # 웹앱 출처. 쉼표로 구분하고 https://*.vercel.app 같은 패턴도 된다. 바꾸려면 CORS_ALLOWED_ORIGINS 환경변수를 넘긴다(운영은 compose에 추가)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://toggleme.site,https://www.toggleme.site,http://localhost:[*]}

management:
  health:
    mail:
      # 메일 서버 연결을 상태 확인에 넣지 않는다. 포함되면 SMTP 장애·로그인 거부가 /actuator/health 503이 되어 배포가 실패한다
      enabled: false
  endpoints:
    web:
      exposure:
        # prometheus는 Grafana Cloud가 가져간다. 대시보드 관리자 계정(HTTP Basic)으로 막는다(DashboardSecurityConfig)
        include: health, prometheus

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 30m
  refresh-token-expiry: 14d

kakao:
  app-id: ${KAKAO_APP_ID:}
  # 책장 AI 추천의 책 검색(카카오 다음 책 검색 API)에 쓰는 REST API 키. 서버 전용이다
  rest-api-key: ${KAKAO_REST_API_KEY:}

naver:
  # NAVER API HUB 검색 API (냉장고 AI 추천의 음식 사진 검색)
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}

aws:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    # 로컬·테스트는 개발 버킷, 운영은 S3_BUCKET으로 운영 버킷을 지정한다
    bucket: ${S3_BUCKET:toggleme-dev-images}

logging:
  level:
    # 중복 키 오류 로그에 입력값(이메일, 아이디)이 남지 않게 한다. 예상하지 못한 오류는 GlobalExceptionHandler가 기록한다
    org.hibernate.orm.jdbc.error: ERROR

admin:
  dashboard:
    username: ${ADMIN_DASHBOARD_USERNAME:}
    password: ${ADMIN_DASHBOARD_PASSWORD:}
