spring:
  application:
    name: toggle-me
  config:
    import: optional:file:.env[.properties]
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.1-flash-lite
    # 재시도는 Gemini SDK 한 곳에서만 한다(GeminiConfig). 이 값은 재시도 횟수라 2면 SDK 재시도와 곱해져 호출이 늘어난다
    retry:
      max-attempts: 0
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:toggleme}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  # Nginx(HTTPS) 뒤에서 X-Forwarded-Proto·For를 반영한다. Tomcat이 내부 프록시 대역에서 온 헤더만 신뢰한다
  forward-headers-strategy: native
  tomcat:
    redirect-context-root: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 30m
  refresh-token-expiry: 14d

kakao:
  app-id: ${KAKAO_APP_ID:}

toss:
  # 앱인토스 서버 API(mTLS). 인증서·개인 키 경로는 저장소 밖 파일을 가리킨다. 비워 두면 토스 로그인은 502로 실패한다
  api-base-url: ${TOSS_API_BASE_URL:https://apps-in-toss-api.toss.im}
  cert-path: ${TOSS_MTLS_CERT_PATH:}
  key-path: ${TOSS_MTLS_KEY_PATH:}
  # 토스가 연결 끊기 콜백을 보낼 때 쓰는 Basic Auth. 앱인토스 콘솔에 같은 값을 등록한다. 비워 두면 콜백을 모두 거절한다
  callback-username: ${TOSS_CALLBACK_USERNAME:}
  callback-password: ${TOSS_CALLBACK_PASSWORD:}

naver:
  # NAVER API HUB 검색 API (냉장고 AI 추천의 음식 사진 검색)
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}

aws:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    # 로컬·테스트는 개발 버킷, 운영은 S3_BUCKET으로 운영 버킷을 지정한다
    bucket: ${S3_BUCKET:toggleme-dev-images}

logging:
  level:
    # 중복 키 오류 로그에 입력값(이메일, 아이디)이 남지 않게 한다. 예상하지 못한 오류는 GlobalExceptionHandler가 기록한다
    org.hibernate.orm.jdbc.error: ERROR
