<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Toggle, Me! 운영 현황</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17221c;
            --muted: #526159;
            --paper: #edf1ef;
            --surface: #ffffff;
            --line: #cdd6d1;
            --accent: #c5532d;
            --accent-soft: #f2ded2;
            --focus: #1f6b4f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        }

        ::selection { background: var(--accent-soft); color: var(--ink); }

        button, select { font: inherit; }

        button:focus-visible, select:focus-visible {
            outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
            outline-offset: 2px;
        }

        main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 64px; }

        header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            padding-bottom: 24px;
            border-bottom: 2px solid var(--ink);
        }

        h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); line-height: 1.08; letter-spacing: -0.03em; }
        h2 { margin: 0 0 6px; font-size: 18px; }
        p { margin: 0; }
        .muted { color: var(--muted); }
        #generated-at { margin-top: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }

        .controls { display: flex; gap: 8px; }
        select, button {
            min-height: 42px;
            border: 1px solid var(--ink);
            border-radius: 10px;
            background: var(--surface);
            color: var(--ink);
            padding: 8px 12px;
        }
        button { cursor: pointer; background: var(--ink); color: var(--surface); font-weight: 700; }
        button:hover { background: var(--focus); }
        button:disabled { cursor: wait; opacity: .55; }

        #status { min-height: 24px; margin: 14px 0 0; color: #a13625; }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin: 28px 0 42px;
            border-block: 1px solid var(--line);
        }
        .metric { padding: 22px 20px; border-right: 1px solid var(--line); }
        .metric:first-child { padding-left: 0; }
        .metric:last-child { border-right: 0; }
        .metric dt { color: var(--muted); font-size: 13px; }
        .metric dd {
            margin: 4px 0 0;
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 760;
            line-height: 1.15;
            letter-spacing: -0.025em;
            font-variant-numeric: tabular-nums;
        }

        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
        .panel-head { display: flex; justify-content: space-between; gap: 24px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
        .panel-head p { max-width: 54ch; font-size: 13px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
        th, td { padding: 12px 22px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
        tr:last-child td { border-bottom: 0; }
        th { color: var(--muted); font-size: 12px; font-weight: 650; }
        .number { text-align: right; }
        .trend { width: 38%; min-width: 180px; }
        .track { height: 8px; overflow: hidden; border-radius: 4px; background: var(--accent-soft); }
        .bar { width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width 320ms ease-out; }
        .empty { padding-block: 36px; text-align: center; color: var(--muted); }

        @media (max-width: 720px) {
            main { width: min(100% - 24px, 1120px); padding-top: 24px; }
            header { align-items: stretch; flex-direction: column; }
            .controls { width: 100%; }
            .controls select { flex: 1; }
            .metrics { grid-template-columns: 1fr 1fr; }
            .metric:nth-child(2) { border-right: 0; }
            .metric:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
            .metric, .metric:first-child { padding: 18px 12px; }
            .panel-head { flex-direction: column; gap: 4px; }
            th, td { padding-inline: 16px; }
            .trend { display: none; }
        }

        @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Toggle, Me! 운영 현황</h1>
            <p id="generated-at" class="muted">데이터를 불러오는 중입니다.</p>
        </div>
        <div class="controls">
            <select id="days" aria-label="조회 기간">
                <option value="7">최근 7일</option>
                <option value="14" selected>최근 14일</option>
                <option value="30">최근 30일</option>
                <option value="90">최근 90일</option>
            </select>
            <button id="refresh" type="button">새로고침</button>
        </div>
    </header>

    <p id="status" role="status" aria-live="polite"></p>

    <dl class="metrics" aria-label="전체 핵심 지표">
        <div class="metric"><dt>회원</dt><dd id="members">—</dd></div>
        <div class="metric"><dt>방</dt><dd id="rooms">—</dd></div>
        <div class="metric"><dt>기록</dt><dd id="items">—</dd></div>
        <div class="metric"><dt>팔로우</dt><dd id="follows">—</dd></div>
    </dl>

    <section class="panel" aria-labelledby="daily-title">
        <div class="panel-head">
            <div>
                <h2 id="daily-title">일별 신규 활동</h2>
                <p class="muted">한국 시간 기준 회원 가입과 취향 기록 생성 수입니다.</p>
            </div>
            <p class="muted" id="period-summary"></p>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>날짜</th><th class="number">신규 회원</th><th class="number">새 기록</th><th class="trend">활동량</th></tr></thead>
                <tbody id="daily"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const number = new Intl.NumberFormat("ko-KR");
    const $ = (selector) => document.querySelector(selector);

    function cell(text, className) {
        const element = document.createElement("td");
        element.textContent = text;
        if (className) element.className = className;
        return element;
    }

    function render(data) {
        for (const key of ["members", "rooms", "items", "follows"]) {
            $(`#${key}`).textContent = number.format(data.summary[key]);
        }

        const totals = data.daily.reduce((sum, day) => ({
            members: sum.members + day.members,
            items: sum.items + day.items
        }), { members: 0, items: 0 });
        $("#period-summary").textContent = `${data.days}일 동안 회원 +${number.format(totals.members)} · 기록 +${number.format(totals.items)}`;
        $("#generated-at").textContent = `마지막 갱신 ${new Date(data.generatedAt).toLocaleString("ko-KR")}`;

        const maximum = Math.max(1, ...data.daily.map((day) => day.members + day.items));
        const rows = [...data.daily].reverse().map((day) => {
            const row = document.createElement("tr");
            const trend = cell("", "trend");
            const track = document.createElement("div");
            const bar = document.createElement("div");
            track.className = "track";
            bar.className = "bar";
            bar.style.width = `${((day.members + day.items) / maximum) * 100}%`;
            track.append(bar);
            trend.append(track);
            row.append(cell(day.date), cell(number.format(day.members), "number"), cell(number.format(day.items), "number"), trend);
            return row;
        });
        if (rows.length === 0) {
            const row = document.createElement("tr");
            const empty = cell("선택한 기간에 신규 활동이 없습니다.", "empty");
            empty.colSpan = 4;
            row.append(empty);
            rows.push(row);
        }
        $("#daily").replaceChildren(...rows);
    }

    async function load() {
        const refresh = $("#refresh");
        refresh.disabled = true;
        $("#status").textContent = "";
        try {
            const response = await fetch(`/api/v1/admin/dashboard?days=${$("#days").value}`, { credentials: "same-origin" });
            if (response.status === 401) throw new Error("관리자 로그인이 필요합니다. 페이지를 새로고침해 다시 로그인하세요.");
            if (!response.ok) throw new Error(`데이터를 불러오지 못했습니다. (HTTP ${response.status})`);
            render(await response.json());
        } catch (error) {
            $("#status").textContent = error.message;
        } finally {
            refresh.disabled = false;
        }
    }

    $("#refresh").addEventListener("click", load);
    $("#days").addEventListener("change", load);
    load();
</script>
</body>
</html>
