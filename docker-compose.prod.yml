# 운영 서버(EC2) 전용. 로컬 개발은 docker-compose.yml을 쓴다
# 값은 서버의 ~/toggleme/.env에서 읽는다. 항목과 근거는 docs/workflows/deployment.md
name: toggleme

services:
  app:
    image: ghcr.io/itta-10th-team1/toggle-me-backend:${APP_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 운영 DB는 RDS. 서버 .env의 RDS 엔드포인트를 쓴다
      DB_HOST: ${DB_HOST:?DB_HOST 필요}
      DB_NAME: ${DB_NAME:-toggleme}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME 필요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요}
      KAKAO_APP_ID: ${KAKAO_APP_ID:?KAKAO_APP_ID 필요}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY 필요}
      # 냉장고 AI 추천의 음식 사진 검색. 비어 있으면 추천 사진이 모두 빠진다(서버는 정상 기동)
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      # 운영 프로필. 메일 설정(MAIL_USERNAME·MAIL_PASSWORD)이 비어 있으면 앱이 기동하지 않는다
      SPRING_PROFILES_ACTIVE: prod
      # 가입·비밀번호 재설정 인증 메일 발송(Gmail SMTP). MAIL_PASSWORD는 Google 앱 비밀번호
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ADMIN_DASHBOARD_USERNAME: ${ADMIN_DASHBOARD_USERNAME:-}
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD:-}
      # S3 자격 증명은 EC2 IAM 역할(toggleme-ec2-role)로 받는다. 컨테이너에서 쓰려면 메타데이터 홉 제한이 2여야 한다
      S3_BUCKET: toggleme-prod-images
      JDK_JAVA_OPTIONS: ${JDK_JAVA_OPTIONS:--Xmx256m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=32m -XX:+ExitOnOutOfMemoryError}
      SERVER_TOMCAT_THREADS_MAX: "50"
      MALLOC_ARENA_MAX: "2"
      TZ: UTC
    mem_limit: 640m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
